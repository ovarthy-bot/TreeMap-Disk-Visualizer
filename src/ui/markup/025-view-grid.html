  <!-- ═══════════ Grid ═══════════ -->
  <section class="view" id="view-grid" role="tabpanel" aria-label="Izgara" hidden>
    <div class="grid-toolbar">
      <button class="btn" id="gridUpBtn" title="Bir üst klasöre çık (Escape)" aria-label="Bir üst klasöre çık"><span data-icon="arrowUp"></span></button>
      <div class="crumbs" id="gridCrumbs"></div>
      <div class="spacer"></div>
      <div class="field">
        <span data-icon="search"></span>
        <input type="text" id="gridSearch" placeholder="Dosyaları filtrele…  ( / )" aria-label="Dosyaları ada göre filtrele" autocomplete="off">
      </div>
      <span class="label-pair">
        <label for="gridSort">Sırala</label>
        <select id="gridSort" aria-label="Izgarayı sırala">
          <option value="size">Boyut</option>
          <option value="name">Ad</option>
          <option value="date">Değiştirilme tarihi</option>
          <option value="accessed">Son erişim</option>
          <option value="reclaim">Geri kazanım puanı</option>
          <option value="type">Tür</option>
        </select>
      </span>
    </div>
    <div class="glass" id="gridScroll"><div id="gridInner"></div></div>
  </section>

  <!-- ═══════════ Apps ═══════════ -->
  <section class="view" id="view-apps" role="tabpanel" aria-label="Uygulamalar" hidden>
    <div class="card glass">
      <h2><span data-icon="box"></span>Uygulamaya göre depolama</h2>
      <div class="apps-info muted" id="appsInfo"></div>
      <div class="apps-scatter" id="appsScatter" hidden>
        <div class="as-h">Dosya sayısına karşılık boyut</div>
        <!-- What a dot is, and the axes titled (design pass G24): the dots
             were unlabelled and the log axis read "4.5 GB / 1.0 MB / 1.0 KB /
             0 B" with no word for what it measured. The hover is the chart
             kit's own tooltip: the app's name, its files, its size. -->
        <div class="as-note muted">Noktaların tümü bir uygulamadır — adını, dosya sayısını ve boyutunu görmek için üzerine gelin veya sekmeyle grafiğe geçip ok tuşlarını kullanın.</div>
        <!-- The canvas keeps its own wrapper: the chart kit anchors tooltips to the canvas parent.
             A widget with keys of its own (sixth browser pass H54): the chart kit makes it a tab
             stop, walks the dots with the arrow keys and says each one aloud. -->
        <div class="as-plot">
          <span class="as-y">Boyut</span>
          <div class="as-wrap"><canvas id="appsScatterChart" height="200" aria-label="Uygulamaların dosya sayısına karşılık boyutu — uygulamalar arasında gezinmek için ok tuşlarını kullanın" role="application" aria-roledescription="scatter chart"></canvas></div>
        </div>
        <div class="as-x">Dosya sayısı</div>
      </div>
      <div id="appsBody"><div class="muted">Uygulamaların ne kadar disk alanı kapladığını görmek için bir tarama yapın.</div></div>
      <div id="appsWorking" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
  </section>

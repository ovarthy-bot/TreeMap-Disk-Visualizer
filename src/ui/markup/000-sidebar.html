<!-- The one navigation surface: a collapsible liquid-glass sidebar. It
     replaced the horizontal header when the header ran out of width — at
     mild page zoom the search box clipped and overlapped its neighbours,
     because ten tabs, a search box and three actions were competing for one
     row. A column never has that fight: every item owns its own line, and
     collapsing to an icon rail returns the space when the user wants it. -->
<aside id="sideNav" aria-label="Gezinme">
  <div class="side-top">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="1" y="1" width="14" height="24" rx="4" fill="#30D158"/>
        <rect x="17" y="1" width="8" height="14" rx="3.5" fill="#FFD60A"/>
        <rect x="17" y="17" width="8" height="8" rx="3.5" fill="#FF453A"/>
      </svg>
      <span class="side-label">TreeMap<span class="sub">Disk Alanı Görselleştirici</span></span>
    </div>
    <span id="headerSpin" aria-hidden="true"></span>
    <button class="icon-btn" id="sideToggle" aria-label="Gezinmeyi daralt" aria-expanded="true"
            title="Gezinmeyi daralt"></button>
  </div>

  <!-- A4: global search. Lives at the top of the sidebar, not in a view,
       because it searches everything TreeMap has indexed rather than
       whatever happens to be on screen. "/" focuses it from anywhere (⌘K is
       the command palette, which carries a search row);
       on the collapsed rail those shortcuts (or the icon) open the sidebar
       first, so the input genuinely exists to be focused. -->
  <div class="gsearch" id="gsearchWrap">
    <!-- No decorative magnifier inside the box: the placeholder already says
         what this is, and the injector-replaces-the-element behaviour made a
         separately-positioned icon a recurring alignment bug. The rail form
         below keeps its icon — there, the icon IS the control. -->
    <input type="text" id="gsearch" placeholder="Tüm dizine eklenmiş dosyaları ara…"
           aria-label="Tüm dizine eklenmiş dosyaları ara" aria-expanded="false"
           aria-controls="gsearchResults" role="combobox" aria-autocomplete="list"
           autocomplete="off" spellcheck="false">
    <!-- FX wiring: the "line" beam lives on this overlay strip, not on the
         wrap — the beam sets overflow:hidden on its host, and the wrap anchors
         the results panel, which must overflow. -->
    <span class="fx-beam-strip" id="gsearchBeamStrip" aria-hidden="true"></span>
    <button class="gsearch-rail-btn" id="gsearchRailBtn" aria-label="Tüm dizine eklenmiş dosyaları ara" title="Ara (/)" tabindex="-1">
      <span data-icon="search" data-size="15"></span>
    </button>
    <div class="gsearch-panel" id="gsearchResults" role="listbox" aria-label="Arama sonuçları" hidden></div>
  </div>

  <nav class="tabbar" role="tablist" aria-label="Görünümler" aria-orientation="vertical">
    <button role="tab" aria-selected="true" data-view="dashboard" aria-label="Kontrol Paneli" title="Dashboard"><span data-icon="dashboard"></span><span class="side-label">Kontrol Paneli</span></button>
    <button role="tab" aria-selected="false" data-view="treemap" aria-label="Ağaç Haritası" title="Treemap"><span data-icon="treemap"></span><span class="side-label">Ağaç Haritası</span></button>
    <button role="tab" aria-selected="false" data-view="city" aria-label="Disk Şehri" title="Disk City"><span data-icon="city"></span><span class="side-label">Disk Şehri</span></button>
    <button role="tab" aria-selected="false" data-view="grid" aria-label="Izgara" title="Grid"><span data-icon="grid"></span><span class="side-label">Izgara</span></button>
    <button role="tab" aria-selected="false" data-view="apps" aria-label="Uygulamalar" title="Apps"><span data-icon="box"></span><span class="side-label">Uygulamalar</span></button>
    <button role="tab" aria-selected="false" data-view="games" aria-label="Kütüphaneler" title="Libraries"><span data-icon="play"></span><span class="side-label">Kütüphaneler</span></button>
    <button role="tab" aria-selected="false" data-view="security" aria-label="Güvenlik" title="Security"><span data-icon="shield"></span><span class="side-label">Güvenlik</span></button>
    <button role="tab" aria-selected="false" data-view="fleet" aria-label="Ağ Cihazları" title="Fleet"><span data-icon="globe"></span><span class="side-label">Ağ Cihazları</span></button>
    <button role="tab" aria-selected="false" data-view="missing" aria-label="Kayıp GB" title="Missing GB"><span data-icon="pie"></span><span class="side-label">Kayıp GB</span></button>
    <button role="tab" aria-selected="false" data-view="duplicates" aria-label="Yinelenenler" title="Duplicates"><span data-icon="copy"></span><span class="side-label">Yinelenenler</span></button>
    <button role="tab" aria-selected="false" data-view="trends" aria-label="Eğilimler" title="Trends"><span data-icon="trendUp"></span><span class="side-label">Eğilimler</span></button>
    <button role="tab" aria-selected="false" data-view="history" aria-label="Geçmiş" title="History"><span data-icon="calendar"></span><span class="side-label">Geçmiş</span></button>
    <button role="tab" aria-selected="false" data-view="offloaded" aria-label="Tahliye Edilenler" title="Offloaded"><span data-icon="archive"></span><span class="side-label">Tahliye Edilenler</span></button>
    <button role="tab" aria-selected="false" data-view="capsule" aria-label="Geri Alma Kasası" title="Undo Vault"><span data-icon="clock"></span><span class="side-label">Geri Alma Kasası</span></button>
    <button role="tab" aria-selected="false" data-view="autopilot" aria-label="Otopilot" title="Autopilot"><span data-icon="autopilot"></span><span class="side-label">Otopilot</span></button>
  </nav>

  <div class="side-foot">
    <button class="btn" id="cleanupBtn" title="Temizle — Eski veya büyük dosyaları bul ve çöpe at"><span data-icon="sparkles"></span><span class="side-label">Clean Up</span></button>
    <div class="side-foot-row">
      <button class="icon-btn" id="settingsBtn" aria-label="Ayarlar" title="Ayarlar (Schedules & Ignore / Zamanlamalar & Yoksayma)"></button>
      <button class="icon-btn" id="themeToggle" aria-label="Açık veya koyu temaya geç" title="Temayı değiştir"></button>
    </div>
  </div>
</aside>
<div id="navScrim" aria-hidden="true"></div>
